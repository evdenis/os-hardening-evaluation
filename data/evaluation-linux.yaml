      - CONFIG_IOMMU_DMA
      - CONFIG_IOMMU_DEFAULT_DMA_LAZY
      - CONFIG_INTEL_IOMMU
      - CONFIG_INTEL_IOMMU_SVM
      - CONFIG_INTEL_IOMMU_SCALABLE_MODE_DEFAULT_ON
      - CONFIG_AMD_IOMMU
      - CONFIG_IOMMU_SVA
