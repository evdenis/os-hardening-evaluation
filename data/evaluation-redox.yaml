      code is unsafe-heavy). A=3 structural. T_age=2 (freelist design
      landed 2024-03-22, 2ba9ff72), T_maintained=3 (hardened 2025-11,
      dc33c679) → T=2. The generic safe-container benefit remains
      captured under C1f.1.
