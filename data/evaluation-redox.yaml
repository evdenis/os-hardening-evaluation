        kernel. CR4.CET bits are not toggled.
    commits: []
    discussions: []
    rationale: >-
      P=0.
    arm64:
      P:
      D: 0
      S: 0
      A: 0
      T_age:
      T_maintained:
      implementation:
        config_options: []
        source_files:
        - "sources/redox/targets/aarch64-unknown-kernel.json (AArch64 target; Intel CET-IBT is not applicable)"
        default_state: >-
          Intel IBT (CET indirect-branch tracking) is x86-only; the arm64
