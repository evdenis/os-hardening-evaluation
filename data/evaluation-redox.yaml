      — removing access is done by building a narrower namespace, which
      is coarser-grained than seccomp-bpf), A=3 core, T_age=2,
      T_maintained=3.
  C4.5:
    P:
    D: 0
    S: 0
    A: 0
    T_age:
    T_maintained:
